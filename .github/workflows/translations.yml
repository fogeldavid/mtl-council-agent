name: Prepare English translations

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Weekly ingestion]
    types: [completed]

# Write, to commit new translations to main. Streamlit Cloud deploys main, so
# the site serves them without anyone copying the file in by hand.
permissions:
  contents: write

jobs:
  translate:
    # workflow_run checks out only the trusted default branch; never a PR head.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            scratch/huggingface
            scratch/translation-fr-en
            scratch/translation-tokenizer
          key: local-marian-fr-en-int8-v1
      - name: Install local translation dependencies
        run: pip install -e '.[translation]'
      - name: Refresh saved English titles and context
        # Below the job's 90 minutes, so a big batch still reaches the commit
        # step: translations are saved as they go, and next week continues.
        timeout-minutes: 75
        env:
          WEB_DATABASE_URL: ${{ secrets.WEB_DATABASE_URL }}
        run: python scripts/refresh_translations.py
      # The file also records when coverage was last checked, so it changes on
      # every run. Commit only when a translation was added or changed.
      - name: Commit new translations
        if: ${{ !cancelled() }}
        run: |
          python - <<'EOF' > translations-changed
          import json, subprocess
          path = "src/mtl_council_agent/app/data/english-translations.json"
          old = json.loads(subprocess.run(["git", "show", f"HEAD:{path}"],
                                          capture_output=True, text=True, check=True).stdout)
          new = json.load(open(path))
          print("yes" if old.get("entries") != new.get("entries") else "no")
          EOF
          if [ "$(cat translations-changed)" != "yes" ]; then
            echo "No new translations."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mtl_council_agent/app/data/english-translations.json
          git commit -m "Update English translations"
          # Someone may have pushed while the model ran; replay onto the latest main.
          git pull --rebase origin main
          git push origin HEAD:main
      # Rejected translations (numbers that didn't survive) stay French; their
      # list is kept here for review.
      - uses: actions/upload-artifact@v4
        with:
          name: english-translations
          path: |
            src/mtl_council_agent/app/data/english-translations.json
            scratch/translation-review.json
          retention-days: 30
