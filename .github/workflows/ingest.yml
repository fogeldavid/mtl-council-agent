name: Weekly ingestion

on:
  schedule:
    # Mondays 06:00 UTC. Council meets roughly monthly, so weekly is ample
    # headroom to catch new meetings and late-published minutes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install package
        run: pip install -e .

      # Idempotent and 40KB. Runs first so roll-call surnames and roster
      # details resolve against the current council.
      - name: Load council roster
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: mtl-council-agent load-roster

      # A recent window, not the CLI's two-year backfill default. This job
      # looks for meetings published since it last ran and for minutes that
      # appeared after a meeting was first ingested; minutes trail their
      # meeting by weeks, so the window has to be comfortably wider than that
      # without re-walking years of history every Monday.
      - name: Ingest new meetings and newly published minutes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: mtl-council-agent -v ingest --since "$(date -u -d '120 days ago' +%Y-%m-%d)"

      - name: Report data quality
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: mtl-council-agent quality-report --check --since "$(date -u -d '120 days ago' +%Y-%m-%d)"
